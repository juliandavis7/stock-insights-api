version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-insights-api:latest
    container_name: stock-insights-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-dev}
      - PORT=8080
    volumes:
      # Optional: Mount for development - comment out for production testing
      # - .:/app
      - ./api.log:/app/api.log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

